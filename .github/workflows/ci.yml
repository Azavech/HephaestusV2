name: CI

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: xcode-27
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Check public data
        run: scripts/check-public.sh

      - name: Check docs
        run: scripts/check-docs.sh

      - name: Build
        run: swift build

      - name: Test
        run: swift test
